{% extends 'Posts/base.html' %}
{% block title %}Supprimer l'article{% endblock %}
{% block content %}
<h1>Supprimer l'article</h1>
<p>Confirmer la suppression de « {{ object.title }} » ?</p>
<form method="post" class="form-card">
    {% csrf_token %}
    <button class="button-danger" type="submit">Confirmer</button>
    <a class="button" href="{% url 'Posts:listhtml' %}">Annuler</a>
</form>
{% endblock %}
