{% extends 'Posts/base.html' %}
{% block title %}Supprimer l'article{% endblock %}
{% block content %}
<h1>Supprimer l'article</h1>
<p>Confirmer la suppression de « {{ object.title }} » ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer</button>
    <a href="{% url 'Posts:listhtml' %}">Annuler</a>
</form>
{% endblock %}
